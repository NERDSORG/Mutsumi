name: Release

on:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check-types

      - name: Compile
        run: pnpm run compile

  package:
    name: Package VSIX
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download tree-sitter WASM files
        shell: bash
        run: |
          cd assets/tree-sitter
          for i in 1 2 3; do
            timeout 300 python download_wasm.py && break
            echo "WASM download attempt $i failed, retrying..."
            sleep 5
          done

      - name: Compile
        run: pnpm run compile

      - name: Package VSIX
        run: pnpm exec vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: mutsumi-universal
          path: ./*.vsix
          if-no-files-found: error

  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Read version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download VSIX artifact
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: mutsumi-universal

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mutsumi v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/mutsumi-universal/*.vsix
